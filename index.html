<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きたむらミュージックスクール</title>
  <link rel="icon" href="images/sitetitle_icon.svg" type="image/svg">
  <meta name="description" content="ミュージックスクールご紹介サイトです">
  <meta name="keywords" content="ミュージックスクール, レッスン">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- header -->
     <header>
      <div class="l-header" id="header">
        <div class="l-header-inner">
          <div class="c-site-title">
            <h1>
              <a href="#">
                <img src="images/sitetitle_icon.svg" alt="きたむらミュージックスクール">
                <span class="c-site-title__text">きたむら<br class="u-pc-only"><span class="c-site-title__text--sub">ミュージックスクール</span></span>
              </a>
            </h1>
          </div>
          <!-- PC用ナビ -->
           <div class="c-global-nav u-pc-only">
            <nav>
              <ul class="c-global-nav__list">
                <li><a href="">料金</a></li>
                <li><a href="">ブログ</a></li>
                <li><a href="">卒業実績</a></li>
              </ul>
              <div class="c-global-nav__contact-wrap">
                <a href="" class="c-btn c-global-nav__contact">お問い合わせ</a>
              </div>
            </nav>
           </div>      
        </div>

        <!-- ハンバーガーボタンSP用 -->
         <button id="hamburger-block" class="c-hamburger u-sp-only">
          <span class="c-hamburger__inner">
            <span class="c-hamburger__line"></span>
            <span class="c-hamburger__line"></span>
            <span class="c-hamburger__line"></span>
          </span>
         </button>

         <!-- ハンバーガーナビゲーションSP用 -->
          <div class="c-drawer-menu u-sp-only" id="js-drawer">
            <nav>
              <ul class="c-drawer-menu__list">
                <li><a href="">料金</a></li>
                <li><a href="">ブログ</a></li>
                <li><a href="">卒業実績</a></li>
              </ul>
            </nav>
          </div>
      </div>
     </header>

     <main class="main">
      <!-- FV -->
      <section id="FV" class="p-fv">
        <div class="p-fv__image">
          <picture>
            <source srcset="images/fv_sp.jpg" media="(max-width: 767px)">
            <img src="images/fv.jpg" alt="きたむらミュージックスクール">
          </picture>
        </div>
        <div class="p-fv__text">
          <h2 class="p-fv__title">「音楽で生きる」<br class="sp-only">を叶える<br>ミュージックスクール</h2>
        </div>
      </section>

      <!-- concept -->
      <section id="concept" class="p-concept">
        <div class="l-inner">
          <h2 class="p-concept__title">全人類、ミュージシャン計画。</h2>
          <p class="p-concept__text">私たちは音楽を愛するすべての人が、音楽に熱狂できる世界を目指しています。</p>
          <div class="p-concept__img">
            <img src="images/semicircle.png" alt="カーブ画像">
          </div>
          <ul class="p-concept__list">
            <li class="p-concept__item">
              <span class="p-concept__label">Enthusiasm</span>
              <div class="p-concept__center">
                <span class="p-concept__dot"></span>
              </div>
              <span class="p-concept__text-jp">熱狂し</span>
            </li>
            <li class="p-concept__item">
              <span class="p-concept__label">Envision</span>
              <div class="p-concept__center">
                <span class="p-concept__dot"></span>
              </div>
              <span class="p-concept__text-jp">想像し</span>
            </li>
            <li class="p-concept__item">
              <span class="p-concept__label">Effulgent</span>
              <div class="p-concept__center">
                <span class="p-concept__dot"></span>
              </div>
              <span class="p-concept__text-jp">輝く存在へ</span>
            </li>


            
          </ul>
        </div>
      </section>




     </main>

  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
